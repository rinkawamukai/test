  <main>
    <section class="sub-hero compact-hero">

  <script>
  (()=>{'use strict';
    const labels={mens:'男性向け',womens:'女性向け'},order=['mens','womens'];
    const root=document.getElementById('article-groups');
    const makeSection=(category,items)=>{
      const section=document.createElement('section');section.className='panel blog-category-section';section.id=category;
      const label=document.createElement('p');label.className='section-label';label.textContent=category.toUpperCase();
      const h2=document.createElement('h2');h2.textContent=labels[category]||category;
      const ul=document.createElement('ul');ul.className='blog-article-list';
      items.sort((a,b)=>b.date.localeCompare(a.date)).forEach(a=>{const li=document.createElement('li'),link=document.createElement('a'),title=document.createElement('strong'),desc=document.createElement('span');link.href=`./${encodeURIComponent(a.category)}/${encodeURIComponent(a.slug)}/`;title.textContent=a.title;desc.textContent=a.description;link.append(title,desc);li.append(link);ul.append(li)});
      section.append(label,h2,ul);return section;
    };
    fetch('./list.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(items=>{const groups=items.reduce((g,a)=>((g[a.category]??=[]).push(a),g),{});root.replaceChildren();[...order,...Object.keys(groups).filter(k=>!order.includes(k))].filter(k=>groups[k]).forEach(k=>root.append(makeSection(k,groups[k]))) }).catch(()=>{root.innerHTML='<section class="panel"><h2>記事一覧を取得できませんでした</h2><p class="muted">Webサーバー経由で再読み込みしてください。</p></section>'});
  })();
  </script>
