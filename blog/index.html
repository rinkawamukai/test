<script>(()=>{'use strict';const labels={mens:'男性向け',womens:'女性向け'},order=['mens','womens'],root=document.getElementById('article-groups');function section(category,items){const s=document.createElement('section');s.className='card category-section';s.id=category;const h=document.createElement('h2');h.className='category-title';h.textContent=labels[category]||category;const ul=document.createElement('ul');ul.className='article-list';items.sort((a,b)=>b.date.localeCompare(a.date)).forEach(a=>{const li=document.createElement('li'),link=document.createElement('a'),strong=document.createElement('strong'),span=document.createElement('span');link.href=`./${encodeURIComponent(a.category)}/${encodeURIComponent(a.slug)}/`;strong.textContent=a.title;span.textContent=a.description;link.append(strong,span);li.append(link);ul.append(li)});s.append(h,ul);return s}fetch('./list.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(items=>{const groups=Object.groupBy?Object.groupBy(items,x=>x.category):items.reduce((g,x)=>((g[x.category]??=[]).push(x),g),{});root.replaceChildren();[...order,...Object.keys(groups).filter(k=>!order.includes(k))].filter(k=>groups[k]).forEach(k=>root.append(section(k,groups[k]))) }).catch(()=>{root.innerHTML='<section class="card"><h2 class="category-title">記事一覧を取得できませんでした</h2><p>Webサーバー経由で再読み込みしてください。</p></section>'})})();</script></body></html>
